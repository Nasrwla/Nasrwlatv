<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بەڕێوەبردنی Kurd TV - Desktop Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: white; padding: 30px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }

        /* Layout Grid for Desktop */
        .main-layout { display: grid; grid-template-columns: 400px 1fr; gap: 30px; align-items: start; }

        .card { background: #161616; padding: 25px; border-radius: 12px; border: 1px solid #222; position: sticky; top: 30px; }
        h2, h3 { text-align: center; color: #3498db; margin-top: 0; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #0f0f0f; color: white; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }

        .btn-add { background: #2ecc71; color: white; width: 100%; font-size: 18px; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add:hover { background: #27ae60; transform: translateY(-2px); }

        .counter { text-align: center; font-size: 22px; margin-bottom: 20px; color: #f1c40f; background: #161616; padding: 15px; border-radius: 12px; border: 1px solid #222; }

        /* Channel List Table-like Style */
        .ch-list { display: flex; flex-direction: column; gap: 10px; }
        .ch-item { background: #1a1a1a; padding: 12px 20px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; transition: 0.2s; }
        .ch-item:hover { border-color: #444; background: #222; }

        .ch-index { font-size: 18px; font-weight: bold; color: #555; min-width: 40px; }
        .ch-info { display: flex; align-items: center; flex: 1; margin: 0 20px; }
        .ch-info img { width: 60px; height: 40px; object-fit: contain; background: #000; border-radius: 4px; margin-left: 15px; border: 1px solid #333; }
        .ch-details b { font-size: 16px; display: block; color: #fff; }
        .ch-details small { color: #666; font-size: 12px; word-break: break-all; }

        .actions { display: flex; gap: 10px; }
        .btn-move { background: #9b59b6; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-move:hover { background: #8e44ad; }
        .btn-edit { background: #3498db; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Edit Modal */
        #editModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #161616; padding: 30px; border-radius: 12px; border: 2px solid #3498db; z-index: 1000; width: 450px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="counter" id="channelCount">کۆی کەناڵەکان: 0</div>

    <div class="main-layout">
        <!-- Sidebar: Add Channel -->
        <div class="card">
            <h2>زیادکردنی کەناڵی نوێ</h2>
            <div class="input-group">
                <label>ناوی کەناڵ</label>
                <input type="text" id="title" placeholder="بۆ نموونە: Astera Sport">
            </div>
            <div class="input-group">
                <label>بەش (Category)</label>
                <div style="display: flex; gap: 10px;">
                    <select id="category" style="flex: 1;">
                        <option value="گشتی">گشتی</option>
                        <option value="منداڵان">منداڵان</option>
                        <option value="وەرزشی">وەرزشی</option>
                        <option value="نیوس">نیوس</option>
                        <option value="دۆکۆمێنتەری">دۆکۆمێنتەری</option>
                        <option value="بیانی">بیانی</option>
                    </select>
                    <button onclick="addNewCategory()" style="width: auto; padding: 0 15px; background: #3498db; border:none; color:white; border-radius:6px; cursor:pointer; font-weight:bold;">+</button>
                </div>
            </div>
            <div class="input-group">
                <label>لینکی پەخش (URL)</label>
                <input type="text" id="url" placeholder="m3u8 یان mpd یان لینکی ماڵپەڕ">
            </div>
            <div class="input-group">
                <label>لینکی وێنە (Logo URL)</label>
                <input type="text" id="thumb" placeholder="https://...">
            </div>
            <button class="btn-add" onclick="saveChannel()">ناردن بۆ ئەپ 🚀</button>
            <button onclick="clearAllChannels()" style="width: 100%; margin-top: 15px; background: none; border: 1px solid #c0392b; color: #c0392b; padding: 10px; cursor: pointer; border-radius: 6px; font-weight: bold;">سڕینەوەی هەموو کەناڵەکان 🗑️</button>
        </div>

        <!-- Main Content: Channel List -->
        <div id="channelList" class="ch-list">
            <!-- لیستی کەناڵەکان لێرە دەردەکەون -->
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="overlay" id="overlay" onclick="closeEdit()"></div>
<div id="editModal">
    <h3>دەستکاری کەناڵ</h3>
    <input type="hidden" id="editKey">
    <div class="input-group"><label>ناو</label><input type="text" id="editTitle"></div>
    <div class="input-group">
        <label>بەش</label>
        <select id="editCategory"></select>
    </div>
    <div class="input-group"><label>لینکی پەخش</label><input type="text" id="editUrl"></div>
    <div class="input-group"><label>لینکی وێنە</label><input type="text" id="editThumb"></div>
    <div style="display:flex; gap:10px; margin-top: 20px;">
        <button class="btn-add" onclick="updateChannel()" style="flex:1; padding: 12px;">پاشەکەوت</button>
        <button onclick="closeEdit()" style="flex:1; background:#444; color:white; border:none; border-radius:6px; cursor:pointer;">داخستن</button>
    </div>
</div>

<script>
    const firebaseDatabaseUrl = "https://kurd-96a88-default-rtdb.firebaseio.com/";
    let allChannels = [];

    async function fetchChannels() {
        const response = await fetch(firebaseDatabaseUrl + "channels.json");
        const data = await response.json();
        const listDiv = document.getElementById('channelList');
        listDiv.innerHTML = "";
        allChannels = [];

        if (data) {
            Object.keys(data).forEach(key => {
                allChannels.push({ key: key, ...data[key] });
            });

            // ڕیزکردن بەپێی "order"
            allChannels.sort((a, b) => (a.order || 0) - (b.order || 0));

            allChannels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'ch-item';
                item.innerHTML = `
                    <div class="ch-index">#${index + 1}</div>
                    <div class="ch-info">
                        <img src="${ch.thumbnailUrl || ''}" onerror="this.src='https://via.placeholder.com/60x40?text=No+Img'">
                        <div class="ch-details">
                            <b>${ch.title} <span style="color:#3498db; font-size:12px; margin-right:10px;">[${ch.category || 'گشتی'}]</span></b>
                            <small>${ch.url.substring(0, 70)}${ch.url.length > 70 ? '...' : ''}</small>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-move" onclick="moveToPosition(${index})">شوێن گۆڕین ➕</button>
                        <button class="btn-edit" onclick="openEdit('${ch.key}')">گۆڕین</button>
                        <button class="btn-delete" onclick="deleteChannel('${ch.key}')">سڕینەوە</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }
        document.getElementById('channelCount').innerText = `کۆی کەناڵەکان: ${allChannels.length}`;
    }

    async function saveChannel() {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        const thumb = document.getElementById('thumb').value.trim();
        const category = document.getElementById('category').value;

        if (!title || !url) return alert("تکایە ناو و لینک پڕ بکەرەوە");

        const order = allChannels.length > 0 ? Math.max(...allChannels.map(c => c.order || 0)) + 1 : 0;

        await fetch(firebaseDatabaseUrl + "channels.json", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, url, thumbnailUrl: thumb, category, order })
        });

        document.getElementById('title').value = "";
        document.getElementById('url').value = "";
        document.getElementById('thumb').value = "";
        fetchChannels();
    }

    async function moveToPosition(currentIndex) {
        const newPos = prompt(`ئەم کەناڵە بخەینە چەندەم دانە؟ (١ تا ${allChannels.length})`, currentIndex + 1);
        if (newPos === null) return;

        let targetIndex = parseInt(newPos) - 1;
        if (isNaN(targetIndex) || targetIndex < 0) targetIndex = 0;
        if (targetIndex >= allChannels.length) targetIndex = allChannels.length - 1;

        if (targetIndex === currentIndex) return;

        const movedItem = allChannels.splice(currentIndex, 1)[0];
        allChannels.splice(targetIndex, 0, movedItem);

        // نوێکردنەوەی هەموو ئۆردەرەکان لە فایربەیس (بە یەکجار)
        const updates = {};
        allChannels.forEach((ch, index) => {
            updates[`channels/${ch.key}/order`] = index;
        });

        await fetch(firebaseDatabaseUrl + ".json", {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updates)
        });

        fetchChannels();
    }

    async function deleteChannel(key) {
        if (!confirm("دڵنیای لە سڕینەوە؟")) return;
        await fetch(`${firebaseDatabaseUrl}channels/${key}.json`, { method: 'DELETE' });
        fetchChannels();
    }

    function openEdit(key) {
        const ch = allChannels.find(c => c.key === key);
        document.getElementById('editKey').value = key;
        document.getElementById('editTitle').value = ch.title;
        document.getElementById('editUrl').value = ch.url;
        document.getElementById('editThumb').value = ch.thumbnailUrl;

        // Sync categories to edit modal
        const editCat = document.getElementById('editCategory');
        editCat.innerHTML = document.getElementById('category').innerHTML;
        editCat.value = ch.category || "گشتی";

        document.getElementById('editModal').style.display = "block";
        document.getElementById('overlay').style.display = "block";
    }

    function closeEdit() {
        document.getElementById('editModal').style.display = "none";
        document.getElementById('overlay').style.display = "none";
    }

    async function updateChannel() {
        const key = document.getElementById('editKey').value;
        const data = {
            title: document.getElementById('editTitle').value.trim(),
            url: document.getElementById('editUrl').value.trim(),
            thumbnailUrl: document.getElementById('editThumb').value.trim(),
            category: document.getElementById('editCategory').value
        };
        await fetch(`${firebaseDatabaseUrl}channels/${key}.json`, {
            method: 'PATCH',
            body: JSON.stringify(data)
        });
        closeEdit();
        fetchChannels();
    }

    function addNewCategory() {
        const newCat = prompt("ناوی بەشە نوێیەکە بنووسە:");
        if (newCat && newCat.trim()) {
            const select = document.getElementById('category');
            const option = document.createElement('option');
            option.value = newCat.trim();
            option.text = newCat.trim();
            select.add(option);
            select.value = option.value;
        }
    }

    async function clearAllChannels() {
        if (!confirm("ئایا دڵنیای لە سڕینەوەی 'هەموو' کەناڵەکان؟ ئەم کارە ناگەڕێتەوە!")) return;
        await fetch(firebaseDatabaseUrl + "channels.json", { method: 'DELETE' });
        fetchChannels();
    }

    fetchChannels();
</script>

</body>
</html>
